<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Blog Section</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .blog-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .blog-card {
            width: 300px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .blog-card h2 {
            margin-bottom: 10px;
        }

        .blog-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .blog-card a {
            text-decoration: none;
            font-weight: bold;
        }

        a[href^="https"] {
            color: red;
        }

        img[src$=".jpg"] {
            border-top-right-radius: 20px;
            border-bottom-left-radius: 20px;
        }

        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }

            .blog-section {
                flex-direction: column;
                align-items: center;
            }

            .blog-card {
                width: 90%;
            }
        }

        @media (orientation: portrait) {
            .blog-section {
                background-color: lightyellow;
            }
        }
    </style>
</head>

<body>

    <h1>Featured Blog Section</h1>

    <div class="blog-section">

        <div class="blog-card">
            <h2>Web Development Tips</h2>

            <img src="https://miro.medium.com/v2/1*V-Jp13LvtVc2IiY2fp4qYw.jpeg" alt="Web Development" height="200" width="300">

            <p>Learn modern HTML, CSS, and JavaScript techniques.</p>
            <br>

            <a href="https://example.com/web">Read More</a>
        </div>

        <div class="blog-card">
            <h2>Travel Guide</h2>

            <img src="https://static.vecteezy.com/system/resources/thumbnails/008/063/100/small/rear-view-portrait-of-young-man-traveler-with-backpack-standing-on-a-mountain-with-arms-spread-open-travel-life-style-and-adventure-concept-free-photo.jpg" alt="Travel" height="200" width="300">

            <p>Discover amazing places around the world.</p>
            <br>

            <a href="https://example.com/travel">Read More</a>
        </div>

        <div class="blog-card">
            <h2>Healthy Living</h2>

            <img src="https://img.magnific.com/premium-photo/health-png-diverse-hands-wellness-remix-transparent-background_53876-941759.jpg?semt=ais_hybrid&w=740&q=80" alt="Health" height="200" width="300">

            <p>Simple habits for a healthier lifestyle.</p>
            <br>

            <a href="https://example.com/health">Read More</a>
        </div>

    </div>

</body>
</html>
